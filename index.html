<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Seniors Tasks Tracker 2026 · Wuduh</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --wuduh-navy:#003087;
  --wuduh-navy-dark:#001F5C;
  --wuduh-navy-mid:#1A4A9F;
  --wuduh-cyan:#00AEEF;
  --wuduh-cyan-light:#E0F5FF;
  --wuduh-cyan-mid:#33BEF2;
  --wuduh-white:#FFFFFF;

  --wakeel:#003087;      --wakeel-bg:#E6EDF8;  --wakeel-mid:#1A4A9F;
  --abdallah:#007A5E;    --abdallah-bg:#E0F4EF;--abdallah-mid:#009E79;
  --leen:#B0005E;        --leen-bg:#FCE8F2;    --leen-mid:#D4246F;
  --enmanuel:#00AEEF;    --enmanuel-bg:#E0F5FF;--enmanuel-mid:#0099D4;

  --task1:#4A3AE8;  --task1-bg:#EEEAFF;
  --task2:#007A5E;  --task2-bg:#E0F4EF;
  --task3:#003087;  --task3-bg:#E6EDF8;
  --task4:#B0005E;  --task4-bg:#FCE8F2;
  --task5:#7A5200;  --task5-bg:#FFF3D6;
  --task6:#00AEEF;  --task6-bg:#E0F5FF;

  --ink:#0D1B3E;
  --ink2:#3A4A6A;
  --ink3:#7A8AAA;
  --surface:#FFFFFF;
  --page:#F0F4FB;
  --border:#D0DAF0;
}

body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--page);color:var(--ink);min-height:100vh}

/* HEADER */
header{background:var(--wuduh-navy);padding:0;position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%, var(--wuduh-navy-mid) 0%, transparent 60%),radial-gradient(ellipse at 10% 80%, #001050 0%, transparent 50%)}
header::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 20px,rgba(0,174,239,.04) 20px,rgba(0,174,239,.04) 21px)}
.header-inner{max-width:1260px;margin:0 auto;padding:2rem 2rem 1.75rem;display:flex;align-items:center;gap:2rem;position:relative;z-index:1}
.logo-block{flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:.5rem .75rem;display:flex;align-items:center}
.header-divider{width:1px;height:48px;background:rgba(255,255,255,.15)}
header h1{font-size:clamp(1.4rem,3vw,2.2rem);font-weight:800;color:#fff;line-height:1.1}
header h1 em{color:var(--wuduh-cyan);font-style:normal}

/* STATS BAR */
.stats-bar{background:#fff;border-bottom:2px solid var(--border);padding:.65rem 2rem}
.stats-inner{max-width:1260px;margin:0 auto;display:flex;gap:1.75rem;align-items:center;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:.4rem;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2)}
.stat-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-chip strong{font-size:13px;font-weight:600;color:var(--ink);margin-left:.15rem}
.stat-divider{width:1px;height:16px;background:var(--border)}

/* TOOLBAR */
.toolbar{max-width:1260px;margin:1.25rem auto 0;padding:0 2rem}
.toolbar-top{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center;margin-bottom:.85rem}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
#search{width:100%;padding:.45rem .75rem .45rem 2.2rem;border:1.5px solid var(--border);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s}
#search:focus{border-color:var(--wuduh-cyan)}
.filter-group{display:flex;gap:.35rem;flex-wrap:wrap}
.filter-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-right:.2rem;align-self:center}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:.28rem .7rem;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s;color:var(--ink2);white-space:nowrap}
.pill:hover{border-color:var(--wuduh-cyan);color:var(--wuduh-navy)}
.pill.active{color:#fff!important;border-color:transparent!important}
.pill-all.active{background:var(--wuduh-navy)}
.pill-wakeel.active{background:var(--wakeel)}
.pill-abdallah.active{background:var(--abdallah)}
.pill-leen.active{background:var(--leen)}
.pill-enmanuel.active{background:var(--enmanuel)}
.pill-task.active{background:var(--wuduh-navy-mid)}
.view-toggle{margin-left:auto;display:flex;border:1.5px solid var(--border);border-radius:7px;overflow:hidden}
.view-btn{padding:.32rem .7rem;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--surface);border:none;cursor:pointer;color:var(--ink2);transition:all .15s;display:flex;align-items:center;gap:5px}
.view-btn.active{background:var(--wuduh-navy);color:#fff}
.view-btn+.view-btn{border-left:1.5px solid var(--border)}
.filter-row2{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
select{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:.28rem .55rem;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);outline:none;cursor:pointer}
select:focus{border-color:var(--wuduh-cyan)}
.reset-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:.28rem .6rem;border:1.5px solid var(--border);border-radius:6px;background:transparent;color:var(--ink2);cursor:pointer;transition:all .15s}
.reset-btn:hover{background:var(--wuduh-navy);color:#fff;border-color:var(--wuduh-navy)}

/* MAIN */
.main{max-width:1260px;margin:1.25rem auto 3rem;padding:0 2rem}
.result-info{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:.85rem}
.result-info strong{color:var(--ink);font-weight:600}

/* TABLE */
.table-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{background:var(--wuduh-navy);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:.55rem .9rem;text-align:left;font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{background:var(--wuduh-navy-mid)}
thead th .sort-icon{opacity:.4;margin-left:.25rem;font-style:normal}
thead th.sorted .sort-icon{opacity:1;color:var(--wuduh-cyan)}
th:nth-child(1){width:110px}th:nth-child(2){width:80px}th:nth-child(3){width:105px}
th:nth-child(4){width:auto}th:nth-child(5){width:130px}th:nth-child(6){width:110px}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#F5F8FF}
td{padding:.5rem .9rem;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2)}
td.date-cell{color:var(--ink);font-weight:600}
td.day-cell{color:var(--ink3);font-size:11px}

.senior-tag{display:inline-block;padding:.12rem .5rem;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.01em}
.senior-wakeel{background:var(--wakeel-bg);color:var(--wakeel)}
.senior-abdallah{background:var(--abdallah-bg);color:var(--abdallah)}
.senior-leen{background:var(--leen-bg);color:var(--leen)}
.senior-enmanuel{background:var(--enmanuel-bg);color:var(--enmanuel)}

.task-tag{display:inline-flex;align-items:center;padding:.12rem .5rem;border-radius:4px;font-size:11px;font-weight:600}
.task-wfh{background:var(--task1-bg);color:var(--task1)}
.task-headcount{background:var(--task2-bg);color:var(--task2)}
.task-payments{background:var(--task3-bg);color:var(--task3)}
.task-coaching{background:var(--task4-bg);color:var(--task4)}
.task-smg{background:var(--task5-bg);color:var(--task5)}
.task-calibration{background:var(--task6-bg);color:var(--task6)}
.task-daily{background:#E6F4F1;color:#0A6B5A}

.freq-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);background:var(--page);padding:.1rem .38rem;border-radius:3px;border:1px solid var(--border)}

/* LINKS CELL */
.links-cell{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:.18rem .45rem;border-radius:4px;border:1px solid var(--border);background:var(--page);color:var(--wuduh-navy);text-decoration:none;transition:all .13s;white-space:nowrap;cursor:pointer}
.link-btn:hover{background:var(--wuduh-navy);color:#fff;border-color:var(--wuduh-navy)}
.link-btn svg{flex-shrink:0}
.link-btn.ref-btn{color:var(--ink3)}
.link-btn.ref-btn:hover{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.link-btn.ref-multi{color:var(--leen)}
.link-btn.ref-multi:hover{background:var(--leen);color:#fff;border-color:var(--leen)}
.na-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3)}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.85rem}
.month-section{margin-bottom:2rem}
.month-header{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--wuduh-navy);padding:.35rem 0;border-bottom:2px solid var(--wuduh-navy);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem;font-weight:600}
.event-card{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:.8rem .9rem;transition:box-shadow .15s,transform .15s}
.event-card:hover{box-shadow:0 4px 18px rgba(0,48,135,.1);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.55rem}
.card-date{font-size:13px;font-weight:700;color:var(--ink)}
.card-dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);margin-top:1px}
.card-body{display:flex;flex-direction:column;gap:.35rem}
.card-senior{font-weight:700;font-size:13px}
.card-links{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}

/* SENIOR VIEW */
.senior-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.senior-column{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.senior-col-header{padding:.8rem 1rem;display:flex;align-items:center;gap:.55rem}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.senior-col-header .s-name{font-size:14px;font-weight:700}
.senior-col-header .s-count{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:auto;opacity:.55}
.senior-event-list{padding:.45rem}
.senior-event-item{padding:.38rem .55rem;border-radius:5px;margin-bottom:.22rem;display:flex;flex-direction:column;gap:.2rem;font-size:12px}
.senior-event-item:last-child{margin-bottom:0}
.senior-event-row{display:flex;justify-content:space-between;align-items:center}
.ev-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink2)}
.ev-task{font-weight:700;font-size:11px}
.ev-links{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.1rem}

.empty{text-align:center;padding:4rem 2rem;font-family:'IBM Plex Mono',monospace;color:var(--ink3);font-size:13px}
.empty strong{display:block;font-size:15px;color:var(--ink2);margin-bottom:.4rem}

/* Today */
.today-row td{background:#E8F3FF!important}
.today-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;background:var(--wuduh-cyan);color:#fff;padding:1px 5px;border-radius:3px;margin-left:.35rem;vertical-align:middle}

/* REF DROPDOWN PANEL */
.ref-panel{position:fixed;z-index:1000;background:#fff;border:1.5px solid var(--border);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.14);padding:.6rem;min-width:220px;max-width:320px;display:none}
.ref-panel.open{display:block}
.ref-panel-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.ref-panel a{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--wuduh-navy);text-decoration:none;padding:.25rem .3rem;border-radius:4px;transition:background .1s}
.ref-panel a:hover{background:var(--page);color:var(--wuduh-navy-mid)}
.ref-panel a svg{flex-shrink:0;opacity:.5}
</style>
</head>

// ─── SCHEDULE GENERATION ──────────────────────────────────────────────────────
function getMondaysInRange(start, end) {
  const mondays = [];
  let d = new Date(start);
  while (d.getDay() !== 1) d.setDate(d.getDate() + 1);
  while (d <= end) { mondays.push(new Date(d)); d.setDate(d.getDate() + 7); }
  return mondays;
}
function getThursdaysInRange(start, end) {
  const thursdays = [];
  let d = new Date(start);
  while (d.getDay() !== 4) d.setDate(d.getDate() + 1);
  while (d <= end) { thursdays.push(new Date(d)); d.setDate(d.getDate() + 7); }
  return thursdays;
}
function fmt(d) { return d.toISOString().slice(0, 10); }

const TASK_CLASS = {

const EXT_ICON = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

function linksHtml(task, compact) {
  const meta = TASK_META[task];
  if (!meta) return '';
  let html = '';
  // Sheet link button
  if (meta.link) {
    html += `<a class="link-btn" href="${meta.link}" target="_blank" rel="noopener">${EXT_ICON} Sheet</a>`;
  }
  // Reference buttons
  if (meta.refs.length === 0) {
    html += `<span class="na-label">Ref: N/A</span>`;
  } else if (meta.refs.length === 1) {
    const isVideo = meta.refs[0].label.toLowerCase().includes('video') || meta.refs[0].label.toLowerCase().includes('ref');
    html += `<a class="link-btn ref-btn" href="${meta.refs[0].url}" target="_blank" rel="noopener">${isVideo ? FILM_ICON : EXT_ICON} ${meta.refs[0].label}</a>`;
  } else {
    // Multiple refs — show a dropdown trigger
    const taskKey = task.replace(/\s+/g,'-');
    html += `<button class="link-btn ref-multi" onclick="toggleRefPanel(event,'${taskKey}')" data-task="${task}">${FILM_ICON} Refs (${meta.refs.length})</button>`;
  }
  return html;
}

// ─── REF PANEL ────────────────────────────────────────────────────────────────
let activeRefPanel = null;
function toggleRefPanel(e, taskKey) {
  e.stopPropagation();
  const btn = e.currentTarget;
  const task = btn.dataset.task;
  const panel = document.getElementById('ref-panel');
  const linksDiv = document.getElementById('ref-panel-links');
  const meta = TASK_META[task];
  if (!meta) return;
  if (activeRefPanel === taskKey && panel.classList.contains('open')) {
    panel.classList.remove('open');
    activeRefPanel = null;
    return;
  }
  activeRefPanel = taskKey;
  linksDiv.innerHTML = meta.refs.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener">${FILM_ICON} ${r.label}</a>`
  ).join('');
  const rect = btn.getBoundingClientRect();
  panel.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
  panel.style.top  = (rect.bottom + window.scrollY + 4) + 'px';
  panel.classList.add('open');
}
document.addEventListener('click', () => {
  document.getElementById('ref-panel').classList.remove('open');
  activeRefPanel = null;
});

// ─── STATE & FILTERING ───────────────────────────────────────────────────────
let state = {senior:'all',task:'all',month:'all',search:'',view:'table',sort:{col:'date',dir:1}};
const today = new Date().toISOString().slice(0, 10);

function fmtDate(d) {
  const [,m,dy] = d.split('-');
  const mn = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(dy)} ${mn[parseInt(m)]}`;
}
function seniorTag(s){ return `<span class="senior-tag ${SENIOR_CLASS[s]}">${s}</span>`; }
function taskTag(t){   return `<span class="task-tag ${TASK_CLASS[t]}">${t}</span>`; }
function freqBadge(f){ return `<span class="freq-badge">${f}</span>`; }

function filtered() {
  let data = RAW.slice();
  if (state.senior !== 'all') data = data.filter(e => e.senior === state.senior);
  if (state.task   !== 'all') data = data.filter(e => e.task   === state.task);
  if (state.month  !== 'all') data = data.filter(e => e.date.startsWith(state.month));
  if (state.search) {
    const q = state.search.toLowerCase();
    data = data.filter(e =>
      e.date.includes(q)||e.senior.toLowerCase().includes(q)||
      e.task.toLowerCase().includes(q)||e.freq.toLowerCase().includes(q)||
      e.day.toLowerCase().includes(q)
    );
  }
  return data;
}
function sortedData(data) {
  const {col,dir} = state.sort;
  return data.slice().sort((a,b) => {
    let av=a[col]||'',bv=b[col]||'';
    return av<bv?-dir:av>bv?dir:0;
  });
}

// ─── RENDER STATS ─────────────────────────────────────────────────────────────
function renderStats() {
  const counts = {};
  RAW.forEach(e => { counts[e.senior]=(counts[e.senior]||0)+1; });
  const bar = document.getElementById('stats-bar');
  let html = '';
  SENIORS.forEach((s,i) => {
    if(i>0) html += '<div class="stat-divider"></div>';
    const col = SENIOR_COLORS[s];
    html += `<div class="stat-chip"><span class="dot" style="background:${col.mid}"></span><span>${s}</span><strong>${counts[s]||0}</strong></div>`;
  });
  html += '<div class="stat-divider"></div>';
  html += `<div class="stat-chip"><span>Total</span><strong>${RAW.length}</strong> assignments</div>`;
  bar.innerHTML = html;
}

// ─── RENDER TABLE ─────────────────────────────────────────────────────────────
function renderTable(data) {
  const rows = sortedData(data);
  if (!rows.length) return `<div class="empty"><strong>No results</strong>Try adjusting your filters</div>`;
  const cols = [
    {k:'date',l:'Date'},{k:'day',l:'Day'},{k:'freq',l:'Frequency'},
    {k:'task',l:'Task'},{k:'senior',l:'Senior'},{k:'',l:'Links & Refs'}
  ];
  const th = cols.map(c => {
    if (!c.k) return `<th>${c.l}</th>`;
    const isSorted = state.sort.col === c.k;
    const icon = isSorted?(state.sort.dir===1?'↑':'↓'):'↕';
    return `<th class="${isSorted?'sorted':''}" data-col="${c.k}">${c.l} <i class="sort-icon">${icon}</i></th>`;
  }).join('');
  const tbody = rows.map(e => {
    const isToday = e.date === today;
    return `<tr class="${isToday?'today-row':''}">
      <td class="date-cell">${fmtDate(e.date)}${isToday?'<span class="today-badge">TODAY</span>':''}</td>
      <td class="day-cell">${e.day}</td>
      <td>${freqBadge(e.freq)}</td>
      <td>${taskTag(e.task)}</td>
      <td>${seniorTag(e.senior)}</td>
      <td><div class="links-cell">${linksHtml(e.task)}</div></td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${tbody}</tbody></table></div>`;
}

// ─── RENDER CARDS ─────────────────────────────────────────────────────────────
function renderCards(data) {
  if (!data.length) return `<div class="empty"><strong>No results</strong>Try adjusting your filters</div>`;
  const byMonth = {};
  data.forEach(e => { const mk=e.date.slice(0,7); if(!byMonth[mk]) byMonth[mk]=[]; byMonth[mk].push(e); });
  let html = '';
  Object.entries(byMonth).forEach(([mk,events]) => {
    html += `<div class="month-section"><div class="month-header">${MONTHS_LABEL[mk]||mk}</div><div class="card-grid">`;
    events.forEach(e => {
      const isToday = e.date === today;
      const col = SENIOR_COLORS[e.senior];
      html += `<div class="event-card" style="border-left:3px solid ${col.mid}">
        <div class="card-top">
          <div>
            <div class="card-date">${fmtDate(e.date)}${isToday?' <span class="today-badge">TODAY</span>':''}</div>
            <div class="card-dow">${e.day}</div>
          </div>
          ${freqBadge(e.freq)}
        </div>
        <div class="card-body">
          ${taskTag(e.task)}
          <div class="card-senior" style="color:${col.txt}">${e.senior}</div>
          <div class="card-links">${linksHtml(e.task)}</div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

      <div class="senior-event-list">`;
    if (!events.length) {
      html += `<div style="padding:.5rem;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);text-align:center">No tasks match filters</div>`;
    } else {
      events.forEach(e => {
        const isToday = e.date === today;
        html += `<div class="senior-event-item" style="background:${isToday?'#E8F3FF':col.bg}">
          <div class="senior-event-row">
            <div class="ev-task" style="color:${col.txt}">${e.task}</div>
            ${freqBadge(e.freq)}
          </div>
          <div class="ev-date">${fmtDate(e.date)} · ${e.day}</div>
          <div class="ev-links">${linksHtml(e.task)}</div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  return html + '</div>';
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render() {
  const data = filtered();
  document.getElementById('result-info').innerHTML =
    `Showing <strong>${data.length}</strong> of <strong>${RAW.length}</strong> assignments`;
  const container = document.getElementById('view-container');
  if      (state.view==='table')  container.innerHTML = renderTable(data);
  else if (state.view==='cards')  container.innerHTML = renderCards(data);
  else                            container.innerHTML = renderBySenior(data);

  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      state.sort = {col, dir: state.sort.col===col ? -state.sort.dir : 1};
      render();
    };
  });
}

// ─── WIRING ───────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => { state.search=e.target.value; render(); });

document.getElementById('senior-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-senior]');
  if (!btn) return;
  state.senior = btn.dataset.senior;
  document.querySelectorAll('[data-senior]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});
document.getElementById('task-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-task]');
  if (!btn) return;
  state.task = btn.dataset.task;
  document.querySelectorAll('[data-task]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});
document.getElementById('month-filter').addEventListener('change', e => { state.month=e.target.value; render(); });
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.onclick = () => {
    state.view = btn.dataset.view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
});
document.getElementById('reset-btn').onclick = () => {
  state = {senior:'all',task:'all',month:'all',search:'',view:state.view,sort:{col:'date',dir:1}};
  document.getElementById('search').value = '';
  document.getElementById('month-filter').value = 'all';
  document.querySelectorAll('[data-senior]').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-senior="all"]').classList.add('active');
  document.querySelectorAll('[data-task]').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-task="all"]').classList.add('active');
  render();
};

renderStats();
render();
setTimeout(() => {
  const row = document.querySelector('.today-row');
  if (row) row.scrollIntoView({behavior:'smooth',block:'center'});
}, 200);
</script>
</body>
</html>
